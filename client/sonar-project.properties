# SonarQube Configuration
#sonar.projectKey=cdi-lab-04-client
#sonar.projectName=CDI Lab 04 - Frontend
#sonar.projectVersion=1.0

sonar.projectKey=Client
sonar.projectName=Client
sonar.host.url=http://localhost:9001
sonar.token=sqp_2f143e826852ae6e9bc29fd3e2b4d6075879bf69

# Path to source directories
sonar.sources=src
sonar.tests=src

# Test inclusion patterns
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage exclusions - archivos que no deben contarse para cobertura
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test/**,\
  **/tests/**,\
  **/*.d.ts,\
  **/*.config.ts,\
  **/*.config.js,\
  **/main.tsx,\
  **/vite-env.d.ts,\
  **/*.css,\
  src/navigations/**,\
  src/store/store.ts,\
  src/store/api/types.ts,\
  src/store/api/api-slice.ts,\
  src/store/middleware/**,\
  src/pages/Files.tsx,\
  src/pages/Verify.tsx,\
  src/index.css,\
  src/App.css

# Exclusions - archivos que no deben analizarse
sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  dist/**,\
  build/**,\
  public/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Dependency Check settings
sonar.dependencyCheck.reportPath=./dependency-check-report/dependency-check-report.json
sonar.dependencyCheck.htmlReportPath=./dependency-check-report/dependency-check-report.html

# Source encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts
