# Identificación del proyecto
sonar.projectKey=CDI-Lab-04-F2
sonar.projectName=CDI-Lab-04-F2
sonar.projectVersion=1.0

# URL de tu SonarQube local
sonar.host.url=http://localhost:9001

# Directorios de código fuente y tests
sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Archivos a excluir del análisis
sonar.exclusions=**/node_modules/**,**/test/**,**/*.test.ts,**/*.test.tsx,**/mockData.ts,**/test-utils.tsx,**/setup.ts,**/vite.config.ts,**/vitest.config.ts

# Cobertura de código
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/test/**,**/mockData.ts,**/test-utils.tsx,**/setup.ts

# Configuración de lenguaje
sonar.sourceEncoding=UTF-8