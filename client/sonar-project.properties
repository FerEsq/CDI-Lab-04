# SonarQube Configuration
sonar.projectKey=cdi-lab-04-client
sonar.projectName=CDI Lab 04 - Frontend
sonar.projectVersion=1.0

# Path to source directories
sonar.sources=src
sonar.tests=src

# Test inclusion patterns
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage exclusions - archivos que no deben contarse para cobertura
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test/**,\
  **/tests/**,\
  **/*.d.ts,\
  **/*.config.ts,\
  **/*.config.js,\
  **/main.tsx,\
  **/vite-env.d.ts,\
  **/*.css,\
  **/navigations/**,\
  **/store/store.ts,\
  **/store/api/types.ts,\
  **/store/api/api-slice.ts,\
  **/store/middleware/**,\
  **/pages/Files.tsx,\
  **/pages/Verify.tsx

# Exclusions - archivos que no deben analizarse
sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  dist/**,\
  build/**,\
  public/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts
